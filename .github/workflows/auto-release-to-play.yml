name: Auto-release to Play Store

# Builds a signed AAB on every push to live and uploads it to Google Play
# via the Play Developer API. Push to `live` releases to PRODUCTION at 100%
# (status: completed) — it reaches ALL users after Google's Play review
# (typically a few hours to ~1 day). Release notes are attached as the
# "What's new": per-locale files at mobile/release-notes/<versionName>/
# whatsnew-<playLocale> (e.g. whatsnew-en-US, whatsnew-ar, whatsnew-hi-IN),
# or a legacy single mobile/release-notes/<versionName>.txt (English only).
# For a safer ad-hoc run, trigger this workflow manually (workflow_dispatch)
# and pick a different track (internal/alpha/beta) or status (draft).
#
# NOTE: if "Managed publishing" is ON in Play Console, an API-submitted
# production release is held as "ready to publish" until you click Publish
# in the Console (after review). Turn it OFF for fully hands-off rollout.
#
# WORKS ONLY AFTER:
#   1. The app already exists on Play Console (first AAB uploaded by hand —
#      use build-android-aab.yml + Play Console UI). The Play API can update
#      apps but cannot create the first version.
#   2. The five required repo secrets are set (see "Required secrets" below).
#   3. A Google Cloud Service Account has been linked in Play Console
#      (Setup → API access) and granted release permissions on this app.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64       — from "Bootstrap Android keystore" run
#   ANDROID_KEYSTORE_PASSWORD     — from "Bootstrap Android keystore" run
#   ANDROID_KEY_PASSWORD          — from "Bootstrap Android keystore" run
#   ANDROID_KEY_ALIAS             — from "Bootstrap Android keystore" run
#   PLAY_SERVICE_ACCOUNT_JSON     — paste full contents of the SA JSON key

on:
  push:
    branches: [live]
    paths:
      - "mobile/**"
      - "js/**"
      - "css/**"
      - "i18n/**"
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "delete-account.html"
      - ".github/workflows/auto-release-to-play.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to release on"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status (use draft to upload without rolling out)"
        required: true
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      version_name:
        description: "Version name shown to users. Leave blank to use mobile/android/app/build.gradle."
        required: false
        default: ""

permissions:
  contents: read

env:
  ANDROID_PACKAGE_NAME: com.takbeertime.android

# Avoid concurrent uploads — Play API rejects "edit in progress" overlaps.
concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide version code + name
        id: version
        run: |
          # versionCode must be a strictly increasing integer per upload.
          # github.run_number auto-increments per workflow run in this repo,
          # which is exactly what we need. Bumped by +100 to leave room for
          # historical manual uploads. If build.gradle has an even higher
          # versionCode, respect it.
          GRADLE_FILE="mobile/android/app/build.gradle"
          RUN_VC=$(( ${{ github.run_number }} + 100 ))
          GRADLE_VC="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' "$GRADLE_FILE" | awk '{print $2}' | tr -d '\r' | head -n1)"
          if [ -n "$GRADLE_VC" ] && [ "$GRADLE_VC" -gt "$RUN_VC" ]; then
            VC="$GRADLE_VC"
          else
            VC="$RUN_VC"
          fi

          VN_INPUT="${{ github.event.inputs.version_name }}"
          if [ -z "$VN_INPUT" ]; then
            VN="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' "$GRADLE_FILE" | tr -d '\r' | head -n1)"
            if [ -z "$VN" ]; then
              VN="1.0.${{ github.run_number }}"
            fi
          else
            VN="$VN_INPUT"
          fi
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "Building versionCode=$VC, versionName=$VN"

      - name: Verify Play upload secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set. Complete the service-account handoff before Play uploads can run."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web bundle into mobile/www
        working-directory: mobile
        run: npm run build

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Patch versionCode + versionName
        working-directory: mobile/android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.version_code }}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Decode keystore from secret
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > takbeertime-upload.jks

      - name: Write keystore.properties
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../takbeertime-upload.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Prepare Play release notes ("What's new")
        run: |
          mkdir -p distribution/whatsnew
          VER="${{ steps.version.outputs.version_name }}"
          if [ -d "mobile/release-notes/$VER" ]; then
            # Per-locale notes: mobile/release-notes/<version>/whatsnew-<playLocale>
            # (e.g. whatsnew-en-US, whatsnew-ar, whatsnew-hi-IN, whatsnew-fr-FR).
            cp mobile/release-notes/"$VER"/whatsnew-* distribution/whatsnew/
          elif [ -f "mobile/release-notes/$VER.txt" ]; then
            # Legacy single-file (English only) fallback.
            cp "mobile/release-notes/$VER.txt" distribution/whatsnew/whatsnew-en-US
          else
            printf 'Bug fixes and performance improvements.\n' > distribution/whatsnew/whatsnew-en-US
          fi
          echo "Release-note locales for $VER:"
          # Play caps each locale's "What's new" at 500 CHARACTERS (code points,
          # not bytes). Count with python3 so multibyte scripts (Arabic, Hindi,
          # Bengali, …) aren't mis-measured as bytes; fail early with a clear
          # message instead of letting the Play API reject the upload.
          for f in distribution/whatsnew/whatsnew-*; do
            n=$(python3 -c "import sys;print(len(open(sys.argv[1],encoding='utf-8').read().rstrip(chr(10))))" "$f")
            echo "  $(basename "$f"): $n chars"
            if [ "$n" -gt 500 ]; then
              echo "::error::$(basename "$f") is $n characters (Play limit is 500)."
              exit 1
            fi
          done

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          # On push to live: release to PRODUCTION at 100%. On manual run: use the input.
          track: ${{ github.event.inputs.track || 'production' }}
          status: ${{ github.event.inputs.release_status || 'completed' }}
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew
          releaseName: "${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})"

      - name: Backup AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: takbeertime-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          TRACK="${{ github.event.inputs.track || 'production' }}"
          echo "## Released to Play Store" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** \`$TRACK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** \`${{ github.event.inputs.release_status || 'completed' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TRACK" = "production" ]; then
            echo "Submitted to **production** at 100%. Google Play review (typically a few hours to ~1 day) gates when users actually see it. Track it in Play Console → Release → Production. If 'Managed publishing' is ON, click Publish there once review passes." >> $GITHUB_STEP_SUMMARY
          elif [ "$TRACK" = "internal" ]; then
            echo "Internal testers will see this in a few minutes. Promote to Production from Play Console → Release → Production → Promote when ready." >> $GITHUB_STEP_SUMMARY
          fi
