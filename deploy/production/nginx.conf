server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  location = /health {
    proxy_pass http://api:3001/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api {
    proxy_pass http://api:3001/api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HTML must always be revalidated so a new release (new markup/features in
  # index.html) reaches users immediately, without a hard refresh. Without
  # this, browsers heuristically cache the HTML and keep showing a stale page
  # (e.g. one missing the Qaza Namaz Tracker). The JS/CSS are cache-busted
  # with ?v= query strings, so they stay safe to cache for a long time.
  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Fingerprinted/static assets — cache hard; updates ship under a new ?v=.
  location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|map|json|webmanifest)$ {
    add_header Cache-Control "public, max-age=31536000" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

