services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jamat
      POSTGRES_PASSWORD: jamat
      POSTGRES_DB: jamat
    ports:
      - "5432:5432"
    volumes:
      - jamat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamat -d jamat"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://jamat:jamat@postgres:5432/jamat?schema=public
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    ports:
      - "3001:3001"

volumes:
  jamat_pgdata:
