name: Build Android AAB (manual)

# Builds a signed release AAB ready for Play Store upload — manual trigger only.
# Use this for the FIRST submission to Play Console (the Play Developer API
# can't create the first version of an app — it must be uploaded by hand).
# After that, the auto-release-to-play.yml workflow handles updates.
#
# Requires four signing secrets — run "Bootstrap Android keystore" first:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Play Console (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Integer build code (must be HIGHER than every previously uploaded build)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web bundle into mobile/www
        working-directory: mobile
        run: npm run build

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Apply version overrides
        working-directory: mobile/android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ inputs.version_code }}/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Decode keystore from secret
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Run 'Bootstrap Android keystore' first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > takbeertime-upload.jks

      - name: Write keystore.properties
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../takbeertime-upload.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release AAB + APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # AAB for Play Store, APK for the package-name verification step
          # in Android Developer Verification (which requires a signed APK
          # to prove ownership of the keystore).
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: takbeertime-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takbeertime-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
