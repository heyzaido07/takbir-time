name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - live

jobs:
  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --runInBand

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: takbeer
          POSTGRES_PASSWORD: takbeer
          POSTGRES_DB: takbeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takbeer -d takbeer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://takbeer:takbeer@localhost:5432/takbeer_test?schema=public
      JWT_SECRET: test-jwt-secret-must-be-at-least-32-chars-long-xyz
      ADMIN_EMAIL: ci-admin@takbeertime.test
      FCM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run prisma:generate
      - working-directory: server
        run: npx prisma migrate deploy
      - working-directory: server
        run: npm run build
      - working-directory: server
        run: npm test -- --runInBand

  browser-e2e:
    name: Browser e2e smoke
    runs-on: ubuntu-latest
    needs:
      - web-unit
    env:
      BASE_URL: https://takbeertime.com
      HEALTH_URL: https://takbeertime.com/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --runInBand e2e/00-smoke.test.js

  browser-critical-e2e:
    name: Browser critical regression e2e
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:6002
      SKIP_HEALTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start static app
        run: |
          python3 -m http.server 6002 &
          echo $! > /tmp/takbeer-static.pid
          for i in {1..30}; do
            curl -fsS http://localhost:6002/index.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:e2e -- --runInBand e2e/20-critical-regressions.test.js
      - name: Stop static app
        if: always()
        run: |
          if [ -f /tmp/takbeer-static.pid ]; then
            kill "$(cat /tmp/takbeer-static.pid)" || true
          fi

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - working-directory: mobile
        run: npm ci
      - working-directory: mobile
        run: npm run build
      - working-directory: mobile
        run: npx cap sync android
      - working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
