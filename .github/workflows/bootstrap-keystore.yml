name: Bootstrap Android keystore

# Run this workflow ONCE to generate an upload signing key for Play Store.
# After it finishes:
#   1. Download the "android-keystore" artifact (contains takbeertime-upload.jks).
#       Save a backup somewhere safe — losing this file = can never update the app.
#   2. Open the run's Summary and copy the printed base64.
#   3. Add four secrets to the repo (Settings → Secrets and variables → Actions):
#        ANDROID_KEYSTORE_BASE64   = <the base64 string>
#        ANDROID_KEYSTORE_PASSWORD = <store-password input you used>
#        ANDROID_KEY_PASSWORD      = <key-password input you used>
#        ANDROID_KEY_ALIAS         = <alias input, default: upload>
#   4. From then on, the build/auto-release workflows will sign every release.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias (default: upload)"
        required: true
        default: "upload"
      store_password:
        description: "Keystore password (8+ chars). REMEMBER THIS — store as ANDROID_KEYSTORE_PASSWORD secret."
        required: true
      key_password:
        description: "Key password (8+ chars, can match store password). REMEMBER THIS — store as ANDROID_KEY_PASSWORD secret."
        required: true
      cn_name:
        description: "Common Name on the cert (e.g. Takbeer Time)"
        required: true
        default: "Takbeer Time"
      org:
        description: "Organisation"
        required: true
        default: "Takbeer Time"
      country:
        description: "Two-letter country code"
        required: true
        default: "PK"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore takbeertime-upload.jks \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=${{ inputs.cn_name }}, O=${{ inputs.org }}, C=${{ inputs.country }}"
          ls -la takbeertime-upload.jks

      - name: Encode keystore
        run: |
          base64 -w0 takbeertime-upload.jks > keystore.b64
          echo "## ANDROID_KEYSTORE_BASE64 (copy below into the repo secret)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat keystore.b64 >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Other secrets to add:" >> $GITHUB_STEP_SUMMARY
          echo "- ANDROID_KEY_ALIAS = \`${{ inputs.key_alias }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ANDROID_KEYSTORE_PASSWORD = (the store password you entered)" >> $GITHUB_STEP_SUMMARY
          echo "- ANDROID_KEY_PASSWORD = (the key password you entered)" >> $GITHUB_STEP_SUMMARY

      - name: Print SHA-1 / SHA-256 fingerprints
        run: |
          keytool -list -v \
            -keystore takbeertime-upload.jks \
            -alias "${{ inputs.key_alias }}" \
            -storepass "${{ inputs.store_password }}" \
            | tee fingerprints.txt
          echo "## Certificate fingerprints" >> $GITHUB_STEP_SUMMARY
          echo "Restrict your Android Maps API key to these in Google Cloud Console (Credentials → API key → Application restrictions → Android apps)." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "SHA1|SHA-256" fingerprints.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            takbeertime-upload.jks
            keystore.b64
            fingerprints.txt
          retention-days: 7
          if-no-files-found: error
